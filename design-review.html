<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Portfolio: Designvergleich</title><style>body{font:16px/1.5 system-ui;margin:24px;color:#29343c;background:#f4f6f7}h1{font-size:24px}label{margin-right:20px}select,a{font:inherit}select{padding:8px}main{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px}section{min-width:0;overflow:auto}iframe{border:1px solid #c8d0d5;background:white;max-width:none;height:1030px}h2{font-size:18px}a{color:#267d67}@media(max-width:900px){main{grid-template-columns:1fr}}</style><h1>Portfolio: Designvergleich</h1><p>Links die gesicherte Version, rechts ein Verbesserungsversuch. Die Seite im Rahmen lässt sich separat scrollen.</p><label>Seite <select id="page"><option value="index">Startseite</option><option value="thesis">Modelling Training Status in Football</option><option value="anguilla-search">Anguilla Search</option><option value="survival-analysis">Survival Analysis</option><option value="brownian-motion">Markov Properties of Brownian Motion</option><option value="cyclistic">Chicago Bike Share Analysis</option></select></label><label>Variante <select id="variant"><option value="photos">Bilder, verfeinert</option><option value="plain">Schlichte Leiste</option><option value="list">Leiste mit Projektliste</option><option value="sidebar">Leiste mit Previous/Next</option><option value="particles">Brownian: Partikelillustration</option></select></label><label>Breite <select id="width"><option>900</option><option>390</option><option>981</option><option>1280</option><option>1866</option></select></label><main><section><h2>Gesicherte Version</h2><a id="leftlink" target="_blank">Separat öffnen</a><div><iframe id="left" title="Gesicherte Version"></iframe></div></section><section><h2>Verbesserungsversuch</h2><a id="rightlink" target="_blank">Separat öffnen</a><div><iframe id="right" title="Verbesserungsversuch"></iframe></div></section></main><script>function update(){let p=document.getElementById('page').value,v=document.getElementById('variant').value,w=document.getElementById('width').value;if(v==='particles'){p='brownian-motion';document.getElementById('page').value=p;}let links=[p+'.html','review-'+v+'-'+p+'.html'];for(let i=0;i<2;i++){let side=i?'right':'left';document.getElementById(side).src=links[i];document.getElementById(side).style.width=w+'px';document.getElementById(side+'link').href=links[i];}}document.querySelectorAll('select').forEach(s=>s.addEventListener('change',update));update();</script></html>
